<style>html,body{background:#000}::view-transition-group(root){background:#000}</style>
<!-- Hardware acceleration off: WebGL is missing or software-rendered, so every
     animated frame would be painted on the CPU. The page scripts skip the
     shader, Lenis, canvases and custom cursor when window.__NO_GPU is set, and
     the CSS below freezes the rest -- like reduced motion, but loops stop too. -->
<script>
window.__NO_GPU = (function () {
  try {
    var gl = document.createElement('canvas').getContext('webgl', { failIfMajorPerformanceCaveat: true });
    if (!gl) return true;
    var info = gl.getExtension('WEBGL_debug_renderer_info');
    var renderer = info ? String(gl.getParameter(info.UNMASKED_RENDERER_WEBGL)) : '';
    var lose = gl.getExtension('WEBGL_lose_context');
    if (lose) lose.loseContext();
    return /swiftshader|llvmpipe|softpipe|software|basic render/i.test(renderer);
  } catch (e) { return true; }
})();
if (window.__NO_GPU) document.documentElement.classList.add('no-gpu');
</script>
<style>
  html.no-gpu { scroll-behavior: auto; }
  html.no-gpu .reveal, html.no-gpu .pop-in { opacity: 1; transform: none; }
  html.no-gpu *, html.no-gpu *::before, html.no-gpu *::after {
    animation-duration: 0.01ms !important; animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    text-shadow: none !important; box-shadow: none !important; /* no glows */
  }
  html.no-gpu .cursor { display: none !important; }
  html.no-gpu::view-transition-old(root), html.no-gpu::view-transition-new(root) { animation: none; }
</style>
<script>
// Resolves once this page has finished arriving: at once, or when the page
// transition into it ends. Start-up that would add motion of its own under
// that transition (the shader background) waits for it.
window.__arrived = new Promise(function (done) {
  if (!('onpagereveal' in window)) return done();
  addEventListener('pagereveal', function (e) {
    if (e.viewTransition) e.viewTransition.finished.then(done, done); else done();
  }, { once: true });
});
</script>
<script>
// Decorative shader background: the same bundle and phone settings as
// index.html (the reasoning is there). Runs once the page has loaded and the
// transition into it has finished, then fades in over the painted page.
if (!window.__NO_GPU) {
  if (matchMedia('(hover: none)').matches) {
    window.__SG_OVERRIDE = { grain: 'off', lightType: '3d' };
    window.__SG_DPR = 0.5;
    window.__SG_INTERVAL = 1500;
  }
  const loadShader = () => {
    const s = document.createElement('script');
    s.src = 'dist/shader-background.js';
    s.async = true;
    s.fetchPriority = 'low';
    s.onload = () => {
      // the canvas mounts a frame or two after the script runs; let it paint
      // one frame at opacity 0 so the fade-in actually runs
      const root = document.getElementById('shader-gradient-root');
      const deadline = performance.now() + 5000;
      (function waitForCanvas() {
        if (root.querySelector('canvas')) {
          requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('is-ready')));
        } else if (performance.now() < deadline) requestAnimationFrame(waitForCanvas);
      })();
    };
    document.body.appendChild(s);
  };
  addEventListener('load', () => window.__arrived.then(() => {
    if ('requestIdleCallback' in window) requestIdleCallback(loadShader, { timeout: 800 });
    else setTimeout(loadShader, 200);
  }));
}
</script>

<style>
  /* self-hosted instead of Google Fonts CDN -- avoids a render-blocking

  /* custom cursor */
  .cursor {
    position: fixed; top: 0; left: 0;
    width: 10px; height: 10px;
    background: var(--ink);
    border: 1px solid var(--ink);
    border-radius: 50%;
    pointer-events: none; z-index: 9999;
    transform: translate(-50%, -50%);
    will-change: transform;
    transition: width .4s cubic-bezier(.22,.61,.36,1),
                height .4s cubic-bezier(.22,.61,.36,1),
                background .32s cubic-bezier(.22,.61,.36,1),
                border-color .32s cubic-bezier(.22,.61,.36,1),
                box-shadow .46s cubic-bezier(.22,.61,.36,1);
    box-shadow:
      0 0 6px  rgba(255, 255, 255, 0.42),
      0 0 14px rgba(255, 255, 255, 0.22),
      0 0 28px rgba(255, 255, 255, 0.10),
      0 0 52px rgba(255, 255, 255, 0.04);
  }
  @keyframes cursorBreath {
    0%, 100% {
      box-shadow:
        0 0 10px rgba(255,255,255,0.38),
        0 0 24px rgba(255,255,255,0.18),
        0 0 48px rgba(255,255,255,0.08),
        0 0 88px rgba(255,255,255,0.03);
      border-color: rgba(255,255,255,0.75);
    }
    50% {
      box-shadow:
        0 0 16px rgba(255,255,255,0.62),
        0 0 36px rgba(255,255,255,0.30),
        0 0 72px rgba(255,255,255,0.14),
        0 0 120px rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,1);
    }
  }
  .cursor.hover {
    width: 48px; height: 48px;
    background: transparent;
    border-color: var(--ink);
    box-shadow:
      0 0 12px rgba(255, 255, 255, 0.45),
      0 0 28px rgba(255, 255, 255, 0.22),
      0 0 56px rgba(255, 255, 255, 0.10),
      0 0 96px rgba(255, 255, 255, 0.04);
    animation: cursorBreath 2.4s cubic-bezier(.4,0,.6,1) infinite;
  }
  @media (hover: none) {
    body, a, button, input { cursor: auto; }

  @media (prefers-reduced-motion: reduce) {

  body::before {

  /* --- View Transitions API --- */
  ::view-transition {
    background: #000;
  }
  ::view-transition-group(root) {
    background: #000;
  }
  ::view-transition-image-pair(root) {
    background: #000;
    isolation: isolate;
  }
  ::view-transition-old(root),
  ::view-transition-new(root) {
    mix-blend-mode: normal;
  }

  @view-transition { navigation: auto; }
  /* One curve for every page change and the title handoff: iOS-style, it moves
     on the first frame and glides to a stop, ~90% there at half time, so 400ms
     still reads as quick. (Expo-out switched the page in ~75ms, before the
     title had started to move.) */
  ::view-transition-old(root) {
    animation: 0.2s cubic-bezier(0.32, 0.72, 0, 1) both vt-fade-out;
  }
  ::view-transition-new(root) {
    animation: 0.4s cubic-bezier(0.32, 0.72, 0, 1) both vt-fade-in;

  @keyframes vt-fade-out {

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }

  /* Keyboard-only escape hatch past the nav. Parked off-canvas rather than

  /* The skip target takes focus programmatically; a ring around the whole

  main:focus { outline: none; }

  /* Touch targets. These labels are 10-13px type, which leaves hit boxes of

     the inline axis pulled back by an equal negative margin so nothing moves.
     Vertical padding on an inline box grows the hit area without touching the
     line box, so the layout is identical. Scoped to coarse pointers, so mouse
     hover regions are left exactly as they were. */
  @media (hover: none) and (pointer: coarse) {

<script>
(function() {
  const c = document.createElement('canvas');
  c.width = 256; c.height = 256;
  const ctx = c.getContext('2d');
  const imageData = ctx.createImageData(256, 256);
  const d = imageData.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = Math.random() * 255;
    d[i] = d[i+1] = d[i+2] = v;
    d[i+3] = 36;
  }
  ctx.putImageData(imageData, 0, 0);
  document.documentElement.style.setProperty('--grain', 'url("' + c.toDataURL() + '")');
})();

<script>
  /* ── custom cursor ── */
  (function setupCursor() {
    const cursor = document.getElementById('cursor');
    if (!cursor) return;
    if (window.__NO_GPU || window.matchMedia('(hover: none)').matches) { cursor.style.display = 'none'; return; }
    let cx = window.innerWidth / 2, cy = window.innerHeight / 2;
    let tx = cx, ty = cy;
    cursor.style.transform = `translate(${cx}px, ${cy}px) translate(-50%, -50%)`;
    document.body.classList.add('custom-cursor');
    window.addEventListener('mousemove', (e) => { tx = e.clientX; ty = e.clientY; }, { passive: true });
    const CURSOR_FOLLOW = 18;
    let lastCursor = 0;
    let settled = false;
    function updateCursor() {
      const now = performance.now();
      const dt = lastCursor ? Math.min((now - lastCursor) * 0.001, 0.05) : 1 / 60;
      lastCursor = now;
      const follow = 1 - Math.exp(-CURSOR_FOLLOW * dt);
      cx += (tx - cx) * follow;
      cy += (ty - cy) * follow;
      if (Math.abs(tx - cx) < 0.01 && Math.abs(ty - cy) < 0.01) {
        if (settled) return;
        settled = true; cx = tx; cy = ty;
      } else settled = false;
      cursor.style.transform = `translate3d(${cx}px, ${cy}px, 0) translate(-50%, -50%)`;
    }
    if (window.gsap) {
      gsap.ticker.add(updateCursor);
    } else {
      (function raf() { updateCursor(); requestAnimationFrame(raf); })();
    }
    document.querySelectorAll('a, button').forEach(el => {
      el.addEventListener('mouseenter', () => cursor.classList.add('hover'));
      el.addEventListener('mouseleave', () => cursor.classList.remove('hover'));
    });
  })();

  /* ── back: every "← back" control ([data-back]) returns to the previous page
     on this site, restoring the visitor's place in it -- history is traversed
     rather than the link followed. In-page #hash entries (the skip link) are
     skipped. With no such page behind us (direct visit, or arrived from
     elsewhere) the link's own href is followed instead. */
  (function backLinks() {
    const links = document.querySelectorAll('a[data-back]');
    if (!links.length) return;
    const otherPage = (url) => {
      try {
        const u = new URL(url);
        return u.origin === location.origin && u.pathname !== location.pathname;
      } catch (e) { return false; }
    };
    const back = (e) => {
      // modified clicks (new tab/window) keep plain link behaviour
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      if (window.navigation && navigation.currentEntry) {
        const prev = navigation.entries().slice(0, navigation.currentEntry.index).reverse()
          .find((entry) => otherPage(entry.url));
        if (prev) { e.preventDefault(); navigation.traverseTo(prev.key); }
      } else if (otherPage(document.referrer) && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    };
    links.forEach((a) => a.addEventListener('click', back));
  })();
</script>
